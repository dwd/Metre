globals:
  default-domain: cassidy.cridland.im
  log:
    level: trace
  healthcheck:
    checks:
      foo.example.org: dave.cridland.net

remote:
  any:
    transport:
      type: s2s
      prefer: direct
      sec: false
    tls:
      config:
        identities:
          - pkey: /home/dwd/test-env/private_key.pem
            chain: /home/dwd/test-env/chain.pem

local:
  cassidy.cridland.im:
    transport:
      type: internal

