name: Build and Test
on: [push]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Apt dance
        run: sudo apt-get update
      - name: Install dependencies
        run: sudo make apt-deps
      - name: And also libcurl
        run: sudo apt-get install libcurl4-openssl-dev
      - name: Set up Python 3.8 for gcovr
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - name: install gcovr 5.0
        run: |
          pip install gcovr==5.0 # 5.1 is not supported
      - name: SonarQube install
        uses: SonarSource/sonarcloud-github-c-cpp@v3
      - name: Install Conan
        run: pip install conan
      - name: Configure Conan Profile
        run: |
          conan profile detect -e
          conan remote add conan-nexus https://nexus.cridland.io/repository/dwd-conan --force
          conan remote login conan-nexus ci --password ${{ secrets.NEXUS_PASSWORD }}
      - name: Conan Deps (Debug)
        run: conan install . -s build_type=Debug -s compiler.cppstd=gnu23  -b missing --version=${{ env.VERSION }}
      - name: Configure Sonar Build
        run: mkdir sonar-build && cmake -S . -B sonar-build -DMETRE_SENTRY=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="conan_provider.cmake" -DCONAN_INSTALL_ARGS="--settings=compiler.cppstd=gnu23;--build=missing"
      - name: Build Wrapper
        run: build-wrapper-linux-x86-64 --out-dir sonar-out cmake --build sonar-build
      - name: CMake Tests
        run: cd ./sonar-build/ && ./metre-test
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Show coverage
        run: cd ./sonar-build && gcovr -r .. --gcov-ignore-parse-errors
      - name: Collate coverage
        run: cd ./sonar-build && gcovr -r .. --gcov-ignore-parse-errors --sonarqube >../coverage.xml
      - name: Sonar Scanner
        run: sonar-scanner --define sonar.cfamily.compile-commands=sonar-out/compile_commands.json --define sonar.coverageReportPaths=coverage.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
